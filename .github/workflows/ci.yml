name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gallery-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: 校验模块依赖
        env:
          GOWORK: "off"
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: 检查错误目录
        env:
          GOWORK: "off"
        run: go run ./cmd/errorcatalog --check
      - name: 检查 OpenAPI 契约
        env:
          GOWORK: "off"
          PLATFORM_OPENAPI_OUTPUT: ${{ runner.temp }}/gallery-openapi.json
        run: |
          go run ./cmd/gallery
          diff -u ../contracts/openapi/gallery.json "$PLATFORM_OPENAPI_OUTPUT"
      - name: 运行测试
        env:
          GOWORK: "off"
        run: go test -timeout 60s ./...
      - name: 构建命令
        env:
          GOWORK: "off"
        run: go build ./cmd/gallery ./cmd/errorcatalog

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 运行测试
        run: pnpm test
      - name: 类型检查
        run: pnpm typecheck
      - name: 生产构建
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
          - name: web
            context: web
    steps:
      - uses: actions/checkout@v4
      - name: 构建 ${{ matrix.name }} 容器
        run: docker build --tag yueli-gallery-${{ matrix.name }}:ci ${{ matrix.context }}
