apiVersion: doctor.yueli.dev/v1
kind: Repository
metadata:
  name: gallery
  class: business-service

toolchains:
  - { name: go, version: 1.25.12 }
  - { name: node, version: 24.18.0 }
  - { name: pnpm, version: 10.28.2 }

dependencies:
  - name: identity
    capability: identity.oidc
    version: ">=1.0"
    urlEnv: IDENTITY_BASE_URL
  - name: asset
    capability: asset.api
    version: ">=1.0"
    urlEnv: ASSET_BASE_URL

configuration:
  - name: api-runtime
    path: api/manifest/config/config.yaml
    example: api/manifest/config/config.example.yaml

migrations:
  - name: gallery-db
    engine: postgres
    directory: api/manifest/sql/migrations
    databaseUrlEnv: GALLERY_DATABASE_URL

tasks:
  - name: web-dependencies
    phase: prepare
    cwd: web
    command: [pnpm, install, --frozen-lockfile]
  - name: development-seed
    phase: prepare
    cwd: api
    command: [go, run, ./cmd/devseed]
  - name: api-error-catalog
    phase: check
    cwd: api
    command: [go, run, ./cmd/errorcatalog, --check]
  - name: api-test
    phase: test
    cwd: api
    command: [go, test, ./...]
  - name: web-unit
    phase: test
    cwd: web
    command: [pnpm, test]
  - name: web-typecheck
    phase: test
    cwd: web
    command: [pnpm, typecheck]
  - name: web-build
    phase: test
    cwd: web
    command: [pnpm, build]

processes:
  - name: gallery-api
    cwd: api
    command: [go, run, ./cmd/gallery]
    health:
      url: http://127.0.0.1:8091/readyz
      timeout: 5m
  - name: gallery-web
    cwd: web
    command: [pnpm, dev, --host, 0.0.0.0]
    health:
      url: http://127.0.0.1:3007/
      timeout: 3m
