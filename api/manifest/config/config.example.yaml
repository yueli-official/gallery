server:
  address: "127.0.0.1:8091"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "gallery_main"

gallery:
  siteSlug: "gallery-main"
  brand: "月离图库"
  asset:
    baseUrl: "http://localhost:8082"
    tokenUrl: "http://localhost:8081/oauth2/token"
    clientId: "gallery-asset-svc"
    clientSecret: "" # inject via secret manager / environment
    scope: "asset:sign"
  operatorSubs:
    - "ac73d232-ce55-487d-bb39-fd336f1a9806"
  jwks:
    url: "http://localhost:8081/oauth2/jwks.json"
    issuer: "http://localhost:8081"
    audience: "gallery-main-web"
    allowLoopbackHttp: true # local development only
