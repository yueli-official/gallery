server:
  address: "127.0.0.1:8091"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "gallery_main"

gallery:
  siteSlug: "gallery-main"
  assetNamespace: "gallery"
  authorization:
    bootstrapAdministratorSubs:
      - "TestA123"
  asset:
    baseUrl: "http://localhost:8082"
    tokenUrl: "http://localhost:8081/oauth2/token"
    clientId: "gallery-asset-svc"
    clientSecret: "" # inject via secret manager / environment
    scope: "asset:sign"
  abuse:
    turnstile:
      secret: ""            # optional; enable challenge escalation for guest submissions
      endpoint: ""          # empty uses Cloudflare Siteverify
      hostnames: []         # trusted public hosts; never infer from request Host
  webhook:
    # Enables durable publication/review/classification integration facts.
    enabled: false
    # Exactly 32 random bytes encoded as base64 or 64 hex characters.
    masterKey: ""
  jwks:
    url: "http://localhost:8081/oauth2/jwks.json"
    issuer: "http://localhost:8081"
    audience: "gallery-main-web"
    allowLoopbackHttp: true # local development only
